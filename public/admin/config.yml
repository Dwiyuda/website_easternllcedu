      - { name: jurusanUnggulan, label: Jurusan unggulan, widget: list, i18n: true, required: false, hint: 'Dipilih Eastern. Tampil hanya kalau Indonesia dan 中文 terisi, dengan urutan yang sama.' }
      - { name: beasiswa, label: Beasiswa, widget: list, i18n: true, required: false, hint: 'Satu beasiswa per butir. Tampil hanya kalau Indonesia dan 中文 terisi, dengan urutan yang sama.' }
      - { name: biayaKuliah, label: 'Biaya kuliah per tahun, mulai dari (RMB)', widget: number, value_type: int, min: 1, required: false, hint: 'Disimpan untuk admin. Tampil hanya kalau sakelar biaya kampus di Pengaturan Situs dinyalakan.' }
      - { name: biayaKuliahSampai, label: 'Biaya kuliah per tahun, sampai (RMB)', widget: number, value_type: int, min: 1, required: false, hint: 'Isi kalau biayanya rentang.' }
      - { name: biayaAsrama, label: 'Biaya asrama per tahun, mulai dari (RMB)', widget: number, value_type: int, min: 1, required: false }
