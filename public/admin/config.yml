  - name: studyTour
    label: Program Study Tour
    label_singular: Program
    description: 'Entri yang salah satu bahasanya belum lengkap tersimpan, tapi belum tampil di website. Daftarnya di halaman /entri-tertahan.'
    folder: src/content/study-tour
    extension: yaml
    format: yaml
    create: true
    i18n: true
    identifier_field: judul
    slug: "{{mulai | date('YYYY-MM')}}-{{slug}}"
    summary: '{{mulai}} · {{judul}}'
    media_folder: media
    public_folder: ./media
    fields:
      - { name: judul, label: Judul (wajib untuk tampil), widget: string, i18n: true, required: false, hint: 'Tanpa tahun atau tanggal. Saat program pertama kali disimpan, alamat halamannya dibentuk dari tahun-bulan tanggal mulai dan judul ini (misalnya 2027-06-guangxi-summer-camp), jadi pakai judul pendek berisi nama tempat. Tab Indonesia tanpa aksara Han; entri dengan aksara Han di sini tertahan (lihat /entri-tertahan).' }
      - { name: ringkasan, label: Ringkasan, widget: text, i18n: true, required: false, hint: 'Satu kalimat isi program.' }
      - { name: jenis, label: Jenis program, widget: select, options: [{ label: Summer Camp, value: summer-camp }, { label: Winter Camp, value: winter-camp }, { label: Campus Tour, value: campus-tour }, { label: Culture Experience Tour, value: culture-experience }] }
      - { name: mulai, label: Tanggal mulai, widget: datetime, format: YYYY-MM-DD, time_format: false }
      - { name: selesai, label: Tanggal selesai, widget: datetime, format: YYYY-MM-DD, time_format: false }
      - { name: kota, label: Rute kota, widget: relation, collection: kota, value_field: '{{slug}}', search_fields: [nama], display_fields: [nama], multiple: true, required: false, hint: 'Urut sesuai perjalanan.' }
      - { name: termasuk, label: Yang termasuk, widget: list, i18n: true, required: false, hint: 'Satu butir per baris, misalnya Visa.' }
      - name: itinerary
        label: Jadwal per hari
        widget: list
        i18n: true
        required: false
        hint: 'Satu butir per hari, urut dari hari pertama. Tanggal tiap hari dihitung otomatis dari tanggal mulai.'
        fields:
          - { name: judul, label: Kegiatan, widget: string, i18n: true }
          - { name: isi, label: Keterangan, widget: text, i18n: true, required: false }
      - { name: harga, label: Harga (Rp), widget: number, value_type: int, required: false, hint: 'Disimpan untuk admin. Tampil hanya kalau sakelar di bawah dinyalakan.' }
      - { name: tampilkanHarga, label: Tampilkan harga di website, widget: boolean, default: false, required: false }
      - { name: sampul, label: Foto sampul, widget: image, choose_url: false, hint: 'Foto mendatar dari program ini.' }
      - { name: contoh, label: Isi contoh, widget: boolean, default: false, required: false, hint: 'Centang kalau isi ini hanya contoh untuk prototipe. Website tidak bisa tayang di domain final selama masih ada isi contoh.' }

