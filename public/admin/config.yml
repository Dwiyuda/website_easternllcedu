# Panel admin Eastern LLC, Sveltia CMS 0.233.1. Label dan petunjuk berbahasa Indonesia (Model Konten aturan 8).
# Isian bertanda "wajib untuk tampil" sengaja tidak dikunci: entri boleh disimpan walau satu bahasa belum lengkap,
# lalu tertahan sampai lengkap (aturan 1). Nomor WhatsApp dan legalitas tidak ada di sini, hanya di kode.
backend:
  name: github
  repo: Dwiyuda/website_easternllcedu
  branch: main
site_url: https://contoh.example
# Tidak dipakai isian gambar mana pun: setiap koleksi bergambar punya media_folder dan public_folder sendiri (tes cms).
media_folder: src/assets/media
public_folder: /src/assets/media
# Isian opsional yang kosong tidak ditulis ke berkas (mis. situs, selesai, tahun). Kuncinya harus di bawah output:
# di tingkat atas Sveltia 0.233.1 mengabaikannya dan tetap menulis ''. Skema (content.config.ts) tetap menerima '' dan null.
output:
  omit_empty_optional_fields: true
media_libraries:
  # Foto stok (Lorem Picsum, Pexels, Pixabay, Unsplash) dimatikan: hanya foto asli Eastern yang boleh dipasang.
  stock_assets:
    providers: []
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400
i18n:
  structure: single_file
  locales: [id, zh]
  default_locale: id

collections:
  - name: halaman
    label: Halaman
    i18n: true
    files:
      - name: beranda
        label: Beranda
        file: src/content/halaman/beranda.yaml
        i18n: true
        fields:
          - { name: siswa, label: Jumlah siswa, widget: string, hint: 'Contoh: 200+' }
          - name: seo
            label: Judul dan deskripsi untuk Google
            widget: object
            i18n: true
            fields:
              - { name: judul, label: Judul, widget: string, i18n: true }
              - { name: deskripsi, label: Deskripsi, widget: text, i18n: true }
          - name: pembuka
            label: Pembuka
            widget: object
            i18n: true
            fields:
              - { name: judul, label: Judul, widget: string, i18n: true }
              - { name: kalimat, label: Kalimat, widget: text, i18n: true }
              - { name: tombol, label: Tombol, widget: string, i18n: true }
          - name: angka
            label: Label angka
            widget: object
            i18n: true
            hint: '{kota} diganti jumlah kota secara otomatis.'
            fields:
              - { name: berdiri, label: Tahun berdiri, widget: string, i18n: true }
              - { name: alumni, label: Alumni, widget: string, i18n: true }
              - { name: kampus, label: Kampus, widget: string, i18n: true }
              - { name: siswa, label: Siswa, widget: string, i18n: true }
          - name: program
            label: Program
            widget: object
            i18n: true
