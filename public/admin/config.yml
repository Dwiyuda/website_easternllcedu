  - name: artikel
    label: Artikel
    label_singular: Artikel
    description: 'Entri yang salah satu bahasanya belum lengkap tersimpan, tapi belum tampil di website. Daftarnya di halaman /entri-tertahan.'
    folder: src/content/artikel
    extension: yaml
    format: yaml
    create: true
    i18n: true
    identifier_field: judul
    slug: '{{slug}}'
    summary: '{{terbit}} · {{judul}}'
    media_folder: media
    public_folder: ./media
    fields:
      - { name: judul, label: Judul (wajib untuk tampil), widget: string, i18n: true, required: false }
      - { name: slugPinyin, label: Slug pinyin (alamat 中文), widget: string, required: false, hint: 'Kosongkan: dibuat otomatis dari judul 中文. Isi hanya untuk mengganti, dengan huruf kecil, angka, dan tanda hubung.', pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Huruf kecil, angka, dan tanda hubung, contoh zhejiang-daxue'] }
      - { name: terbit, label: Tanggal terbit, widget: datetime, format: YYYY-MM-DD, time_format: false, hint: 'Artikel tampil mulai tanggal ini.' }
      - { name: kategori, label: Kategori, widget: select, options: [{ label: Kuliah di Tiongkok, value: kuliah }, { label: Belajar Mandarin, value: belajar-mandarin }, { label: Kegiatan, value: kegiatan }, { label: Pengumuman, value: pengumuman }] }
      - { name: sampul, label: Gambar sampul, widget: image, choose_url: false, hint: 'Foto mendatar.' }
      - { name: ringkasan, label: Ringkasan (wajib untuk tampil), widget: text, i18n: true, required: false }
      - { name: isi, label: Isi (wajib untuk tampil), widget: markdown, i18n: true, required: false, editor_components: [], modes: [rich_text] }
      - { name: terkait, label: Artikel terkait, widget: relation, collection: artikel, value_field: '{{slug}}', search_fields: [judul], display_fields: [judul], multiple: true, required: false }
      - { name: contoh, label: Isi contoh, widget: boolean, default: false, required: false, hint: 'Centang kalau isi ini hanya contoh untuk prototipe. Website tidak bisa tayang di domain final selama masih ada isi contoh.' }

  - name: album
    label: Album Galeri
    label_singular: Album
    description: 'Entri yang salah satu bahasanya belum lengkap tersimpan, tapi belum tampil di website. Daftarnya di halaman /entri-tertahan.'
    folder: src/content/album
    extension: yaml
    format: yaml
    create: true
    i18n: true
    identifier_field: judul
    slug: '{{slug}}'
    summary: '{{tanggal}} · {{judul}}'
    media_folder: media
    public_folder: ./media
    fields:
      - { name: judul, label: Judul (wajib untuk tampil), widget: string, i18n: true, required: false, hint: 'Apa dan di mana, tanpa tanggal. Contoh: Summer camp di Nanning / 南宁夏令营. Tab Indonesia tanpa aksara Han; entri dengan aksara Han di sini tertahan (lihat /entri-tertahan).' }
      - { name: slugPinyin, label: Slug pinyin (alamat 中文), widget: string, required: false, hint: 'Kosongkan: dibuat otomatis dari judul 中文. Isi hanya untuk mengganti, dengan huruf kecil, angka, dan tanda hubung.', pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Huruf kecil, angka, dan tanda hubung, contoh zhejiang-daxue'] }
      - { name: program, label: Program, widget: select, options: [{ label: Kursus Bahasa, value: kursus }, { label: Kelas Kerja Sama, value: kerja-sama }, { label: Study Tour, value: study-tour }, { label: Kuliah ke Tiongkok, value: kuliah }] }
      - { name: tanggal, label: Tanggal kegiatan, widget: datetime, format: YYYY-MM-DD, time_format: false }
      - { name: tayang, label: Tanggal tayang, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false, hint: 'Kosongkan supaya langsung tayang.' }
      - { name: deskripsi, label: Deskripsi singkat, widget: text, i18n: true, required: false, hint: 'Satu kalimat: apa, di mana, kapan. Contoh: Kelas Mandarin untuk karyawan PT Contoh 1, 2019.' }
      - { name: sampul, label: Foto sampul, widget: image, choose_url: false, hint: 'Foto mendatar. Di halaman Galeri dipotong 4:3.' }
      - name: foto
        label: Foto
        widget: list
        required: false
        hint: 'Urut sesuai tampil. Album di atas 60 foto dibagi beberapa halaman. Foto tersimpan di repo sampai penyimpanan foto (Cloudflare R2) siap, jadi pilih foto terbaik saja.'
        fields:
          - { name: gambar, label: Foto, widget: image, choose_url: false }
          - { name: warna, label: Warna foto, widget: select, default: hangat, required: false, options: [{ label: Hangat ringan, value: hangat }, { label: Asli, value: asli }], hint: 'Asli untuk foto yang warnanya sudah hangat atau berubah terlalu jauh dengan filter.' }
          - { name: keterangan, label: Keterangan (Indonesia), widget: string, required: false, pattern: ['^[^\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]*$', 'Aksara Han ditulis di Keterangan 中文'] }
          - { name: keteranganZh, label: Keterangan (中文), widget: string, required: false, hint: 'Tampil di lightbox hanya kalau keterangan Indonesia dan 中文 terisi.' }
      - name: video
        label: Video YouTube
        widget: list
        required: false
        hint: 'Video MP4 menyusul setelah Cloudflare R2 siap.'
        fields:
          - { name: youtube, label: Tautan YouTube, widget: string, hint: 'Contoh: https://www.youtube.com/watch?v=xxxxxxxxxxx', pattern: ['^https:\/\/(www\.youtube\.com\/(watch\?v=|shorts\/)|youtu\.be\/)([\w-]{11})', 'Tautan YouTube diawali https://www.youtube.com/watch?v= atau https://youtu.be/'] }
          - { name: sampul, label: Gambar sampul, widget: image, choose_url: false, hint: 'Gambar mendatar dari video ini. Tampil asli tanpa filter.' }
      - { name: event, label: Event terkait, widget: relation, collection: event, value_field: '{{slug}}', search_fields: [judul], display_fields: [judul], required: false, hint: 'Isi kalau album ini dokumentasi satu event: halaman event menautkannya setelah event selesai.' }
      - { name: studyTour, label: Program study tour terkait, widget: relation, collection: studyTour, value_field: '{{slug}}', search_fields: [judul], display_fields: [judul], required: false, hint: 'Isi kalau album ini dari satu program study tour: halaman programnya menampilkan album ini.' }
      - { name: contoh, label: Isi contoh, widget: boolean, default: false, required: false, hint: 'Centang kalau isi ini hanya contoh untuk prototipe. Website tidak bisa tayang di domain final selama masih ada isi contoh.' }

