id:
  slugPinyin: zhongguo-liuxue-jiangxuejin-leixing-yu-shili
  judul: 'Beasiswa kuliah di Tiongkok: jenis dan contohnya'
  ringkasan: Beasiswa kuliah di Tiongkok datang dari pemerintah pusat, pemerintah provinsi dan kota, dan kampus. Ini jenis-jenisnya, dengan contoh dari alumni Eastern LLC 2024–2025.
  isi: |-
    Beasiswa untuk mahasiswa internasional di Tiongkok (China) tidak hanya satu. Pemberinya bisa pemerintah pusat, pemerintah provinsi atau kota, dan kampus sendiri. Besarnya juga berbeda: ada yang menanggung uang kuliah, asrama, dan uang saku bulanan, ada yang hanya memotong sebagian uang kuliah.

    *Beasiswa Pemerintah Tiongkok.* Dikenal juga sebagai Chinese Government Scholarship atau CSC, dari nama lembaga pengelolanya, China Scholarship Council. Jenis penuhnya bisa menanggung uang kuliah, asrama, uang saku bulanan, dan asuransi kesehatan. Alumni Eastern LLC 2024–2025 ada yang menerima beasiswa ini.

    *Beasiswa pemerintah provinsi dan kota.* Beberapa provinsi punya beasiswa sendiri untuk mahasiswa internasional, misalnya Zhejiang, Jiangsu, Fujian, Jiangxi, dan Shanghai. Sebagian kota juga, seperti Xiamen dan Xi'an. Alumni Eastern LLC ada yang menerima Beasiswa Pemerintah Provinsi Zhejiang.

    *Beasiswa kampus.* Banyak kampus punya beasiswa sendiri, biasanya berdasarkan nilai. Contohnya President Scholarship, yang juga diterima alumni Eastern LLC, Lanshan Scholarship di Nanjing University of Science and Technology, dan beasiswa mahasiswa baru di East China Normal University. Bentuknya bisa bebas uang kuliah, potongan sebagian, atau asrama gratis.

    *Beasiswa guru bahasa Mandarin.* International Chinese Language Teachers Scholarship ditujukan untuk calon guru Mandarin, misalnya jurusan Pendidikan Bahasa Mandarin. Alumni Eastern LLC ada yang menerima beasiswa ini. Di Huaqiao University, jurusan Pendidikan Bahasa Mandarin juga punya beasiswa penuh dengan kontrak mengajar tiga tahun.

    *Sebelum mendaftar.*
    - Syarat dan kuota beasiswa berubah setiap tahun ajaran, jadi informasinya selalu dicek ulang sebelum mendaftar.
    - Tidak ada pihak yang bisa menjamin beasiswa. Keputusannya ada di kampus dan pemberi beasiswa. Beasiswa Pemerintah Tiongkok juga bisa diajukan sendiri tanpa agen.
    - Peran Eastern LLC adalah membantu memilih kampus dan beasiswa yang sesuai, menyiapkan berkas, dan mengikuti jadwalnya sampai keputusan keluar.
  terbit: '2026-10-11'
  kategori: kuliah
