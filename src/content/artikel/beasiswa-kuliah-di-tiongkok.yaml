zh:
  judul: 中国留学奖学金：类型与实例
  ringkasan: 赴华留学奖学金来自中国政府、省市政府和高校。本文介绍主要类型，并以2024–2025年东方校友的获奖情况为例。
  isi: |-
    面向国际学生的中国奖学金不止一种。设奖方可以是中国政府、省市政府，也可以是高校本身。资助力度也各不相同：有的涵盖学费、住宿费和每月生活费，有的只减免部分学费。

    *中国政府奖学金。* 由国家留学基金管理委员会（CSC）负责管理。全额奖学金可涵盖学费、住宿费、生活费和综合医疗保险。2024–2025年有东方校友获得该奖学金。

    *省市政府奖学金。* 浙江、江苏、福建、江西和上海等地设有面向国际学生的政府奖学金，厦门、西安等城市也设有奖学金。有东方校友获得浙江省政府奖学金。

    *高校奖学金。* 许多院校设有自己的奖学金，一般根据成绩评定，例如东方校友获得的校长奖学金、南京理工大学的兰山奖学金和华东师范大学的优秀新生奖学金。形式包括免学费、减免部分学费或免住宿费。

    *国际中文教师奖学金。* 面向有志成为中文教师的学生，例如国际中文教育专业。有东方校友获得该奖学金。华侨大学华文教育专业也提供全额奖学金，须签约任教三年。

    *申请前须知。*
    - 奖学金的条件和名额每学年都会变化，申请前务必再次确认。
    - 任何机构都无法保证获得奖学金，结果由院校和设奖方决定。中国政府奖学金也可以不经中介自行申请。
    - 东方的角色是协助选择合适的院校和奖学金、准备申请材料，并跟进进度直至公布结果。
