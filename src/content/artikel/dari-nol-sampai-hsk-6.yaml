zh:
  judul: 从零基础到HSK六级，在东方需要学多久？
  ringkasan: 根据现行课表，估算东方中文课程从初级到高级各阶段所需的时间。
  isi: |-
    HSK（汉语水平考试）是中国院校认可的中文水平考试。东方的中文课程分为四个级别，每个级别都有对应的HSK目标。

    | 级别 | 目标 | 课时 | 预计时长 |
    |---|---|---|---|
    | 初级 | HSK一至三级 | 每月8至12节 | 约9个月 |
    | 中级 | HSK四级 | 每月16节 | 4个月 |
    | 中高级 | HSK五级 | 每月16节 | 6个月 |
    | 高级 | HSK六级 | 每月16节 | 9个月 |

    每节课75分钟，线下和线上相同。从零基础到HSK四级约需13个月，到HSK六级约需28个月。以上为根据课表的估算，实际进度因人而异，取决于出勤和课后练习。

    *初级分三个阶段。* 初级分为三个阶段，每阶段三个月，依次通过HSK一级、二级和三级。前两个阶段每周上课两次，第三阶段每周三次。

    *中级至高级。* 每周上课四次。中级课程约涵盖2000词，中高级约4000词，高级约5400词，并学习中国文化。

    *平日班与周末班。* 平日班在工作日上课，周末班在周末上课。具体开班时间请咨询课程顾问。
