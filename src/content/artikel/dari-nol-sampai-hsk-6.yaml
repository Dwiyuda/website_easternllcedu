  slugPinyin: congling-jichu-dao-hsk-liuji-zai-dongfang-xuyao-xue-duojiu
  judul: 'Dari nol sampai HSK 6: berapa lama belajar Mandarin di Eastern LLC?'
  ringkasan: Perkiraan lama belajar per jenjang kursus Eastern LLC, dari Basic sampai Advanced, berdasarkan jadwal kelas yang berjalan.
  isi: |-
    HSK adalah ujian kemampuan bahasa Mandarin resmi yang dipakai kampus di Tiongkok (China). Kursus Mandarin Eastern LLC disusun dalam empat jenjang, masing-masing dengan target HSK.

    | Jenjang | Target | Pertemuan | Perkiraan lama |
    |---|---|---|---|
    | Basic | HSK 1–3 | 8–12 kali per bulan | ±9 bulan |
    | Intermediate | HSK 4 | 16 kali per bulan | 4 bulan |
    | Upper Intermediate | HSK 5 | 16 kali per bulan | 6 bulan |
    | Advanced | HSK 6 | 16 kali per bulan | 9 bulan |

    Setiap pertemuan 75 menit, untuk kelas offline maupun online. Dari nol sampai HSK 4 sekitar 13 bulan, dan sampai HSK 6 sekitar 28 bulan. Angka ini perkiraan dari jadwal kelas. Kecepatan tiap siswa berbeda, tergantung kehadiran dan latihan di luar kelas.

    *Basic dalam tiga tahap.* Basic dibagi tiga tahap tiga bulanan: lulus HSK 1, lalu HSK 2, lalu HSK 3. Kelas dua kali seminggu di dua tahap pertama dan tiga kali seminggu di tahap ketiga.

    *Intermediate sampai Advanced.* Kelas empat kali seminggu. Materi Intermediate mencakup sekitar 2.000 kata, Upper Intermediate sekitar 4.000 kata, dan Advanced sekitar 5.400 kata, ditambah pengenalan budaya Tiongkok.

    *Reguler atau weekend.* Kelas reguler pada hari kerja, kelas weekend pada akhir pekan. Jadwal yang sedang dibuka ditanyakan ke admin kursus.
