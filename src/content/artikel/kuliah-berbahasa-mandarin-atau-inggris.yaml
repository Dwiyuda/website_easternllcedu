zh:
  judul: 中文授课还是英文授课？
  ringkasan: 在中国读大学，可以选择中文授课或英文授课，两者在语言要求、专业选择和出发前的准备上有所不同。
  isi: |-
    中国院校的专业分为中文授课和英文授课两种，这一选择决定了语言要求和出发前的准备。

    *中文授课。* 专业选择最多。院校要求提供HSK（汉语水平考试）成绩，最低级别因院校和专业而异，具体要求由留学顾问确认。

    *英文授课。* 专业相对较少，多为工程、计算机、商科和临床医学（MBBS）。院校要求提供雅思等英语成绩。即使用英文上课，日常生活中中文依然很有用。在院校名单中可以直接筛选开设英文授课专业的院校。

    *语言进修。* HSK成绩还不够？许多院校在本科前开设一学期至一年的汉语进修项目，例如浙江大学、同济大学和华东交通大学。

    *在北干巴鲁提前准备。* 东方的HSK课程可以从零基础开始。从零基础到HSK四级大约需要13个月：初级约9个月（至HSK三级），中级4个月。

    *CSCA考试。* 部分院校和奖学金项目开始要求本科申请者参加CSCA考试，详见“申请流程”页面。
