id:
  slugPinyin: zhongwen-shouke-haishi-yingwen-shouke
  judul: Kuliah berbahasa Mandarin atau Inggris?
  ringkasan: Kuliah di Tiongkok bisa berbahasa Mandarin atau Inggris. Bedanya ada di syarat bahasa, pilihan jurusan, dan persiapan sebelum berangkat.
  isi: |-
    Kampus di Tiongkok (China) membuka jurusan dengan dua bahasa pengantar, Mandarin dan Inggris. Pilihan ini menentukan syarat bahasa dan persiapan sebelum berangkat.

    *Berbahasa Mandarin.* Pilihan jurusannya paling banyak. Kampus meminta sertifikat HSK, ujian kemampuan bahasa Mandarin resmi. Level minimalnya berbeda per kampus dan jurusan, jadi admin kuliah memastikan syarat jurusan yang dituju.

    *Berbahasa Inggris.* Jurusannya lebih sedikit, umumnya teknik, komputer, bisnis, dan kedokteran (MBBS). Kampus meminta sertifikat bahasa Inggris seperti IELTS. Mandarin tetap berguna untuk kehidupan sehari-hari di luar kelas. Di Daftar Kampus, kampus yang membuka jurusan berbahasa Inggris bisa disaring langsung.

    *Jalur bahasa.* Belum punya HSK yang cukup? Banyak kampus membuka program bahasa Mandarin satu semester sampai satu tahun sebelum S1, misalnya Zhejiang University, Tongji University, dan East China Jiaotong University.

    *Persiapan dari Pekanbaru.* Kursus HSK Eastern LLC bisa dimulai dari nol. Dari nol sampai HSK 4 sekitar 13 bulan: Basic ±9 bulan sampai HSK 3, lalu Intermediate 4 bulan.

    *Ujian CSCA.* Untuk S1, sebagian kampus dan beasiswa mulai meminta ujian CSCA. Rinciannya di halaman Cara Mendaftar.
  terbit: '2026-10-11'
  kategori: kuliah
