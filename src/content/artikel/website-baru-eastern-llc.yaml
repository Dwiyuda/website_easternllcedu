  judul: Website baru Eastern LLC
  ringkasan: Eastern LLC kini punya website resmi dalam bahasa Indonesia dan Mandarin, menggantikan Google Sites lama.
  isi: |-
    Mulai [tanggal tayang], website resmi Eastern LLC beralamat di [domain]. Website ini menggantikan Google Sites lama, dan tautan di Instagram serta Linktree ikut diganti.

    Isinya:
    - Legalitas Eastern LLC, yaitu NIB dan Izin Operasional LKP, di kaki setiap halaman
    - Kursus Mandarin offline dan online, dengan empat jenjang sampai HSK 6
    - Kelas Mandarin untuk sekolah dan perusahaan
    - Study tour ke Tiongkok
    - Pendampingan kuliah ke Tiongkok, cara mendaftar, dan daftar kampus per kota dengan peta
    - Kabar, event, dan galeri kegiatan

    Website tersedia dalam bahasa Indonesia dan Mandarin. Tombol ID | 中文 di bagian atas membuka halaman yang sama dalam bahasa lain. Nomor admin WhatsApp tidak berubah, dan pilihan admin ada di tombol WhatsApp di pojok kanan bawah setiap halaman.
