zh:
  judul: 东方语言学院新网站上线
  ringkasan: 东方语言学院正式网站上线，提供印尼语和中文两个版本，取代原Google Sites网站。
  isi: |-
    自[上线日期]起，东方语言学院正式网站地址为[域名]。新网站取代原Google Sites网站，Instagram和Linktree上的链接也已同步更新。

    网站内容包括：
    - 办学资质：营业登记号（NIB）和培训机构运营许可，显示在每个页面底部
    - 线下和线上中文课程，四个级别，直至HSK六级
    - 学校和企业中文课程
    - 中国游学
    - 中国留学服务、申请流程，以及按城市分类、附地图的院校名单
    - 新闻动态、活动和相册

    网站提供印尼语和中文两个版本，点击页面顶部的“ID | 中文”即可切换到同一页面的另一种语言。WhatsApp顾问号码保持不变，可通过每个页面右下角的WhatsApp按钮选择对应顾问。
