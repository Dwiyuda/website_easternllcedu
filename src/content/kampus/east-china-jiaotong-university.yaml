zh:
  nama: 华东交通大学
  deskripsi: 华东交通大学创建于1971年，位于江西省南昌市，以交通运输和轨道交通为特色。英文授课本科专业包括土木工程、电气工程及其自动化、交通工程、车辆工程和会计学等，另设汉语进修、硕士和博士项目，并为国际学生提供学校奖学金。
