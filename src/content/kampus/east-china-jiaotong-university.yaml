  deskripsi: East China Jiaotong University (ECJTU) berdiri pada 1971 di Nanchang, Provinsi Jiangxi, Tiongkok (China), dengan bidang utama transportasi dan perkeretaapian. Jurusan S1 berbahasa Inggris antara lain Civil Engineering, Electrical Engineering and Automation, Transportation Engineering, Vehicle Engineering, dan Accounting. Program bahasa Mandarin, S2, dan S3 juga tersedia, dengan beasiswa kampus untuk mahasiswa internasional.
