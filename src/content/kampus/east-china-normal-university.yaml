  nama: East China Normal University
  deskripsi: 'East China Normal University (ECNU) berdiri pada 1951 dan punya dua kampus di Shanghai, Tiongkok (China): Putuo dan Minhang. Jurusan berbahasa Mandarin mencakup bahasa dan budaya Tiongkok, Business Chinese, komputer, psikologi, desain, dan bisnis. S1 berbahasa Inggris tersedia untuk Visual Communication Design, International Economics and Trade, Bioengineering, dan Artificial Intelligence. Beasiswa yang tercatat: ECNU Excellent Freshmen Scholarship dan Beasiswa Pemerintah Shanghai.'
