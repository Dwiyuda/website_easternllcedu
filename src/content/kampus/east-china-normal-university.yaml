zh:
  nama: 华东师范大学
  deskripsi: 华东师范大学创建于1951年，在上海设有普陀和闵行两个校区。中文授课专业包括汉语言与文化、商务汉语、计算机、心理学、设计和工商管理等，英文授课本科专业有视觉传达设计、国际经济与贸易、生物工程和人工智能等。可申请华东师范大学优秀新生奖学金和上海市政府奖学金。
