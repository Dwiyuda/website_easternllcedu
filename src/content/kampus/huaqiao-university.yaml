  nama: Huaqiao University
  deskripsi: Huaqiao University berdiri pada 1960 dengan dua kampus, di Quanzhou dan Xiamen, Provinsi Fujian, Tiongkok (China). Namanya berarti universitas perantau Tionghoa. Jurusan Pendidikan Bahasa Mandarin punya beasiswa penuh dengan kontrak mengajar tiga tahun, dan beasiswa Chen Jiageng tersedia untuk mahasiswa keturunan Tionghoa. Business Administration dan International Business tersedia dalam bahasa Inggris.
