zh:
  nama: 华侨大学
  deskripsi: 华侨大学创办于1960年，在福建泉州和厦门设有两个校区。华文教育专业提供全额奖学金（须签约任教三年），华裔学生可申请陈嘉庚奖学金。工商管理和国际商务设有英文授课项目。
