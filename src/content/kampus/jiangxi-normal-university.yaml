zh:
  nama: 江西师范大学
  deskripsi: 江西师范大学创建于1940年，位于江西省南昌市，设瑶湖和青山湖两个校区。中文授课专业涵盖教育、会计、金融、城乡规划、建筑学和心理学等；计算机科学与技术、国际经济与贸易、工商管理和电子信息工程设有英文授课本科项目。可申请中国政府奖学金、江西省政府奖学金和江西师范大学奖学金。
