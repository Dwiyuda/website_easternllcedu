  nama: Jiangxi Normal University
  deskripsi: 'Jiangxi Normal University (JXNU) adalah universitas keguruan di Nanchang, Provinsi Jiangxi, Tiongkok (China), berdiri pada 1940, dengan kampus Yaohu dan Qingshan Lake. Jurusan berbahasa Mandarin mencakup pendidikan, akuntansi, keuangan, perencanaan kota, arsitektur, dan psikologi. S1 berbahasa Inggris tersedia untuk Computer Science and Technology, International Economics and Trade, Business Administration, dan Electronic Information Engineering. Beasiswa yang tercatat: Pemerintah Tiongkok, Pemerintah Provinsi Jiangxi, dan kampus.'
