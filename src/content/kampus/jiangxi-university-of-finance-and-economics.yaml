zh:
  nama: 江西财经大学
  deskripsi: 江西财经大学创建于1923年，位于江西省南昌市，以经济、会计、金融和管理学科为特色。本科至博士均设有英文授课项目，包括旅游管理、计算机科学与技术、国际商务和市场营销等。可申请江西财经大学奖学金、江西省政府奖学金和中国政府奖学金。
