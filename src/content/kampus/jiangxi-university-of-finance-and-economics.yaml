  nama: Jiangxi University of Finance and Economics
  deskripsi: 'Jiangxi University of Finance and Economics (JXUFE) berdiri pada 1923 di Nanchang, Provinsi Jiangxi, Tiongkok (China), dengan bidang utama ekonomi, akuntansi, keuangan, dan manajemen. Jurusan berbahasa Inggris tersedia dari S1 sampai S3, antara lain Tourism Management, Computer Science and Technology, International Business, dan Marketing. Beasiswa yang tercatat: JXUFE Scholarship, Beasiswa Pemerintah Provinsi Jiangxi, dan Beasiswa Pemerintah Tiongkok.'
