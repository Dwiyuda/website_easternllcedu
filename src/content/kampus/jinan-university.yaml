  nama: Jinan University
  deskripsi: 'Jinan University berdiri pada 1906, dengan kampus utama di Guangzhou, Provinsi Guangdong, Tiongkok (China), serta kampus di Zhuhai dan Shenzhen. Sejak awal kampus ini menerima perantau Tionghoa, dan biaya kuliah untuk mahasiswa keturunan Tionghoa berbeda dari mahasiswa asing lain. Jurusan S1 berbahasa Inggris antara lain Accounting (CPA Canada), Clinical Medicine (MBBS), Computer Science and Technology, Finance, International Journalism, dan Pharmacy. Beasiswa yang tercatat: Pemerintah Tiongkok, pemerintah daerah, Confucius Institute, dan Silk Road.'
