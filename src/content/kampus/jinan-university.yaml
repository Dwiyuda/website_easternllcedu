zh:
  nama: 暨南大学
  deskripsi: 暨南大学创办于1906年，主校区位于广东省广州市，另有珠海和深圳校区，历来面向海外华侨华人招生，华裔学生与其他国际学生的学费标准不同。英文授课本科专业有会计学（CPA加拿大方向）、临床医学（MBBS）、计算机科学与技术、金融学、国际新闻和药学等。可申请中国政府奖学金、地方政府奖学金、孔子学院奖学金和丝绸之路奖学金。
