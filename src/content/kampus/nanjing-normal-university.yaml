  deskripsi: 'Nanjing Normal University (NNU) adalah universitas keguruan di Nanjing, Provinsi Jiangsu, Tiongkok (China), dengan sejarah sejak 1902. Selain pendidikan dan Pengajaran Bahasa Mandarin untuk Penutur Asing, tersedia jurusan bisnis, psikologi, jurnalistik, komputer, kecerdasan buatan, dan desain. S2 berbahasa Inggris tersedia di banyak bidang sains. Beasiswa yang tercatat: Pemerintah Tiongkok, Pemerintah Provinsi Jiangsu, dan kampus.'
