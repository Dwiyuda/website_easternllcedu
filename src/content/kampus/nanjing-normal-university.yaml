  nama: 南京师范大学
  deskripsi: 南京师范大学办学历史可追溯至1902年，位于江苏省南京市。除教育类和汉语国际教育专业外，还开设商科、心理学、新闻、计算机、人工智能和设计等专业，多个理科方向设有英文授课硕士项目。可申请中国政府奖学金、江苏省政府奖学金和学校奖学金。
