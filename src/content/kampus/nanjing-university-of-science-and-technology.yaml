zh:
  nama: 南京理工大学
  deskripsi: 南京理工大学创建于1953年，位于江苏省南京市，工科见长，涵盖机械、车辆、化工、材料和计算机等领域。英文授课本科专业有机械工程、软件工程、国际经济与贸易和纳米材料与技术。成绩优异者可申请兰山奖学金，可免学费、减免50%学费或免住宿费。
