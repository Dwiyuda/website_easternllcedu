  nama: Nanjing University of Science and Technology
  deskripsi: 'Nanjing University of Science and Technology (NJUST) berdiri pada 1953 di Nanjing, Provinsi Jiangsu, Tiongkok (China). Bidang utamanya teknik: mesin, kendaraan, kimia, material, dan komputer. Jurusan S1 berbahasa Inggris: Mechanical Engineering, Software Engineering, International Economics and Trade, dan Nanomaterials and Nanotechnology. Mahasiswa berprestasi bisa mengajukan Lanshan Scholarship, berupa bebas uang kuliah, potongan 50% uang kuliah, atau asrama gratis.'
