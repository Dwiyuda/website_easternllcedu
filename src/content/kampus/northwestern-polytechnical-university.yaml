zh:
  nama: 西北工业大学
  deskripsi: 西北工业大学位于陕西省西安市，在航空、航天和航海领域特色鲜明。英文授课本科专业包括航空航天工程、船舶与海洋工程、材料科学与工程和计算机科学与技术等，并设有硕士和博士项目。可申请中国政府奖学金、西北工业大学校长奖学金和西安“一带一路”奖学金。
