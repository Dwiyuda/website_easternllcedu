zh:
  nama: 上海交通大学
  deskripsi: 上海交通大学创建于1896年，位于上海。中文授课专业覆盖语言、经济、工程和药学等众多领域。英文授课工科以大类培养（Cluster Program）形式开设，包括机械、电子与计算机、材料、船舶与海洋工程和能源动力等方向。学校按综合成绩评定一、二、三等奖学金。
