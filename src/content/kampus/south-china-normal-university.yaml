  nama: South China Normal University
  deskripsi: South China Normal University (SCNU) adalah universitas keguruan yang berdiri pada 1933, dengan kampus Shipai dan University Town di Guangzhou, Provinsi Guangdong, Tiongkok (China), serta kampus Nanhai. Jurusannya mencakup pendidikan, bahasa Mandarin untuk penutur asing, desain, psikologi, komputer, ekonomi, dan musik. Kampus Nanhai membuka Finance program kerja sama dengan Inggris.
