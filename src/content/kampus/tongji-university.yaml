zh:
  nama: 同济大学
  deskripsi: 同济大学创建于1907年，位于上海，建筑、城市规划和土木工程等学科享有盛誉。中文授课专业涵盖工科、设计、医学和语言等，建筑学与城乡规划国际班和临床医学（MBBS）为英文授课。学校另设汉语进修和预科项目。
