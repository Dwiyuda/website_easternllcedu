  nama: Tongji University
  deskripsi: Tongji University berdiri pada 1907 di Shanghai, Tiongkok (China), dan dikenal di bidang arsitektur, perencanaan kota, dan teknik sipil. Jurusan berbahasa Mandarin mencakup teknik, desain, kedokteran, dan bahasa. Kelas internasional Arsitektur dan Perencanaan Kota serta MBBS diajarkan dalam bahasa Inggris. Tersedia juga program bahasa Mandarin dan program persiapan universitas.
  kota: shanghai
