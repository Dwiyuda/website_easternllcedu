zh:
  nama: 厦门大学
  deskripsi: 厦门大学由著名华侨领袖陈嘉庚先生于1921年创办，位于福建省厦门市。中文授课专业门类齐全，涵盖语言、新闻、经济、法学、化学和工科等；临床医学（MBBS）为英文授课，硕士项目设有中英文授课。可申请福建省政府奖学金、厦门市陈嘉庚奖学金和厦门大学奖学金。
