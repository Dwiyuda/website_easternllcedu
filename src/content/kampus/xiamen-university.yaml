  deskripsi: 'Xiamen University didirikan pada 1921 oleh Tan Kah Kee (Chen Jiageng), tokoh perantau Tionghoa, di kota pesisir Xiamen, Provinsi Fujian, Tiongkok (China). Jurusan berbahasa Mandarin sangat beragam, dari bahasa, jurnalistik, ekonomi, dan hukum sampai kimia dan teknik. Clinical Medicine (MBBS) diajarkan dalam bahasa Inggris, dan S2 tersedia dalam dua bahasa pengantar. Beasiswa yang tercatat: Beasiswa Pemerintah Provinsi Fujian, Xiamen Tan Kah Kee Scholarship, dan beasiswa kampus.'
