  nama: Zhejiang Sci-Tech University
  deskripsi: Zhejiang Sci-Tech University (ZSTU) berdiri pada 1897 di kawasan pendidikan Xiasha, Hangzhou, Provinsi Zhejiang, Tiongkok (China). Jurusan desain mode dan tekstilnya beragam, termasuk program kerja sama dengan Amerika Serikat. Jurusan S1 berbahasa Inggris antara lain Computer Science and Technology, Business Administration, dan Fashion Design and Engineering. Program bahasa Mandarin, S1, S2, dan S3 tersedia, dengan beasiswa potongan 50% atau 100% uang kuliah satu tahun.
