zh:
  nama: 浙江理工大学
  deskripsi: 浙江理工大学始建于1897年，位于杭州下沙高教园区，服装设计与纺织类专业丰富，并设有中美合作项目。英文授课本科专业包括计算机科学与技术、工商管理和服装设计与工程等。学校设有汉语进修、本科、硕士和博士项目，奖学金可减免一学年50%或全额学费。
