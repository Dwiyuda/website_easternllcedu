zh:
  nama: 浙江科技大学
  deskripsi: 浙江科技大学位于浙江省杭州市。英文授课本科专业包括机器人工程、计算机科学与技术、数据科学与大数据技术和国际商务等；中文授课专业涵盖建筑学、设计、土木工程和商务汉语等，硕士项目设有中英文授课。可申请中国政府奖学金、浙江省政府新生奖学金和减免学费的优秀学生奖学金。
