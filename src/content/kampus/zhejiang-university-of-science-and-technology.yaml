  nama: Zhejiang University of Science and Technology
  deskripsi: 'Zhejiang University of Science and Technology (ZUST) berada di Hangzhou, Provinsi Zhejiang, Tiongkok (China). Jurusan S1 berbahasa Inggris antara lain Robotics Engineering, Computer Science and Technology, Data Science and Big Data Technology, dan International Business. Jurusan berbahasa Mandarin mencakup arsitektur, desain, teknik sipil, dan Business Chinese, dan S2 tersedia dalam dua bahasa pengantar. Beasiswa yang tercatat: Beasiswa Pemerintah Tiongkok, Beasiswa Pemerintah Provinsi Zhejiang untuk mahasiswa baru, dan beasiswa prestasi berupa potongan uang kuliah.'
