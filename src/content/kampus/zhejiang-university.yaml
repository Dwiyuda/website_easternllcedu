zh:
  nama: 浙江大学
  deskripsi: 浙江大学始建于1897年，位于浙江省杭州市。中文授课专业涵盖人文、理学、工学、医学和艺术等领域，另设临床医学（MBBS）、工程和全球传播与管理等英文授课项目，以及长期和短期汉语进修项目。中文授课项目可申请中国政府奖学金和浙江省政府奖学金。
