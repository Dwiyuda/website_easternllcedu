  nama: Zhejiang University
  deskripsi: Zhejiang University berdiri pada 1897 di Hangzhou, Provinsi Zhejiang, Tiongkok (China). Program berbahasa Mandarin tersedia dari humaniora, sains, dan teknik sampai kedokteran dan seni, ditambah program berbahasa Inggris seperti MBBS, teknik, dan Global Communication and Management. Kampus ini juga membuka program bahasa Mandarin jangka panjang dan jangka pendek. Beasiswa yang tercatat antara lain Beasiswa Pemerintah Tiongkok dan Beasiswa Pemerintah Provinsi Zhejiang untuk program berbahasa Mandarin.
